<html lang="en">
<head>

<title>The Last Ferry · Chapter editor</title>
<style>
@font-face {
  font-family: Yrsa;
  src: url("../game/art/fonts/Yrsa-Medium.ttf") format("truetype");
  font-display: swap;
}
:root {
  color-scheme: dark;
  --background: #102124;
  --surface: #192e30;
  --border: #395151;
  --text: #f1ebde;
  --muted: #b6c8c0;
  --accent: #efc487;
  font: 16px/1.5 system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }
button, select, input, textarea { font: inherit; color: inherit; }
button, select, input[type=number], textarea {
  background: #122427;
  border: 1px solid #617978;
  border-radius: 6px;
}
button, select { padding: .6rem .8rem; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
a { color: var(--accent); text-underline-offset: .15em; }
h1, h2 { font-family: Yrsa, Georgia, serif; font-weight: 500; line-height: 1; margin: 0; }
h1 { font-size: clamp(2.6rem, 1.8rem + 2.2vw, 4rem); }
h2 { font-size: clamp(2rem, 1.5rem + 2vw, 3.5rem); }
main { max-width: 980px; margin: auto; padding: 0 clamp(1rem, 4vw, 2rem) 3rem; }
header { padding: 2.4rem 0 1.15rem; border-bottom: 1px solid var(--border); }
header p { margin: .5rem 0 0; color: var(--muted); }
.brand { color: var(--accent); font-size: .77rem; letter-spacing: .16em; text-transform: uppercase; }
.toolbar { display: flex; flex-wrap: wrap; gap: .8rem 1rem; align-items: end; margin: 1.3rem 0 .65rem; }
.picker { flex: 1 1 290px; display: grid; gap: .3rem; }
.picker label, .notes label { font-weight: 650; }
.picker select { width: 100%; }
.primary { background: var(--accent); border-color: var(--accent); color: #182425; font-weight: 700; }
.status { min-height: 1.6rem; margin: .45rem 0 1rem; color: var(--muted); font-size: .9rem; }
.chapter {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 1.4rem;
  background: var(--surface);
}
.chapter img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.chapter::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(95deg, rgba(12,27,30,.97), rgba(12,27,30,.73));
}
.scene-list { margin: .65rem 0 .3rem; max-width: 48ch; }
.ambience { color: var(--muted); margin: 0; font-size: .9rem; }
.reference { margin: .9rem 0; }
.controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 1rem; margin: 1.3rem 0 .65rem; }
.controls label { cursor: pointer; }
input[type=checkbox] { accent-color: var(--accent); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { text-align: left; padding: .64rem .55rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
thead th { color: var(--muted); font-size: .84rem; }
.numeric { width: clamp(4.1rem, 16vw, 7.2rem); text-align: right; font-variant-numeric: tabular-nums; }
.group th { background: var(--surface); color: var(--accent); font-size: .9rem; }
.component-name { font-weight: 650; }
.unit { display: block; color: var(--muted); font-size: .81rem; margin-top: .05rem; }
input[type=number] { width: 100%; min-width: 0; max-width: 6.1rem; padding: .41rem .28rem; text-align: right; }
tr.changed { background: #26372e; }
tr.changed input { border-color: var(--accent); color: var(--accent); }
input[aria-invalid=true] { border-color: #f3a696; }
details, .notes { margin-top: 1.3rem; padding: 1rem; background: var(--surface); border-radius: 8px; }
summary { cursor: pointer; font-weight: 650; }
details ul { margin-bottom: 0; padding-left: 1.25rem; }
.notes p { margin: .3rem 0 .6rem; color: var(--muted); font-size: .9rem; }
textarea { width: 100%; min-height: 5rem; padding: .6rem; resize: vertical; }
@media (max-width: 500px) {
  header { padding-top: 1.5rem; }
  th, td { padding-inline: .33rem; }
  .toolbar .primary { width: 100%; }
}
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">The Last Ferry</p>
    <h1>Chapter editor</h1>
    <p>Set the target counts you want for each chapter. Download your edits when you’re done.</p>
  </header>
  <div class="toolbar">
    <div class="picker">
      <label for="chapter-select">Chapter</label>
      <select id="chapter-select"></select>
    </div>
    <button class="primary" type="button" id="download">Download edits</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <section class="chapter" aria-labelledby="chapter-title">
    <img id="chapter-art" alt="">
    <h2 id="chapter-title"></h2>
    <p class="scene-list" id="chapter-scenes"></p>
    <p class="ambience" id="chapter-ambience"></p>
  </section>
  <p class="reference"><a href="component-images/00-component-index.png" target="_blank" rel="noopener">Open the component image index</a></p>
  <div class="controls">
    <label><input id="show-all" type="checkbox"> Show components with zero counts</label>
  </div>
  <table aria-label="Editable component counts">
    <thead><tr><th scope="col">Component</th><th scope="col" class="numeric">Current</th><th scope="col" class="numeric">Target</th></tr></thead>
    <tbody id="components"></tbody>
  </table>
  <details id="planks">
    <summary>Current breakable plank groups</summary>
    <ul id="plank-list"></ul>
  </details>
  <div class="notes">
    <label for="chapter-notes">Placement notes <span class="unit">Optional</span></label>
    <p id="notes-help">Name a scene or describe group sizes. For example, “Half-tide Steps: 4 planks, then 3.”</p>
    <textarea id="chapter-notes" aria-describedby="notes-help" rows="3"></textarea>
  </div>
</main>

:"🛤️","name":"Viaduct walks","unit":"dedicated viaduct sections","category":"🪵 Traversal"},{"id":"low-passages","emoji":"🧎","name":"Low passages","unit":"low-roof sections","category":"🪵 Traversal"},{"id":"drains","emoji":"🫧","name":"Drains","unit":"drain sections","category":"🪵 Traversal"},{"id":"walks","emoji":"🚶","name":"Walks","unit":"dedicated walk sections","category":"🪵 Traversal"},{"id":"summit","emoji":"🏁","name":"Summit","unit":"final summit section","category":"🪵 Traversal"}]}</script>
<script>
"use strict";
const baseline = JSON.parse(document.getElementById("baseline").textContent);
const storageKey = "the-last-ferry-chapter-edits:" + baseline.revision;
const picker = document.getElementById("chapter-select");
const list = document.getElementById("components");
const showAll = document.getElementById("show-all");
const notes = document.getElementById("chapter-notes");
const status = document.getElementById("status");
const download = document.getElementById("download");
const changes = new Map();
const chapterNotes = new Map();
let storageAvailable = true;
let chapter = baseline.chapters[0];

function keyFor(chapterId, componentId) {
  return `${chapterId}/${componentId}`;
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    for (const item of baseline.chapters) {
      const note = saved.notes?.[item.id];
      if (typeof note === "string" && note.trim()) chapterNotes.set(item.id, note);
      for (const component of baseline.components) {
        const key = keyFor(item.id, component.id);
        const target = saved.counts?.[key];
        if (Number.isSafeInteger(target) && target >= 0 && target !== (item.counts[component.id] ?? 0)) {
          changes.set(key, target);
        }
      }
    }
    const selected = baseline.chapters.find(item => item.id === saved.chapter);
    if (selected) chapter = selected;
  } catch {
    storageAvailable = false;
  }
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({
      chapter: chapter.id, counts: Object.fromEntries(changes), notes: Object.fromEntries(chapterNotes)
    }));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
}

function updateStatus() {
  const invalid = list.querySelector('input[aria-invalid="true"]');
  const total = changes.size;
  const noteCount = chapterNotes.size;
  download.disabled = Boolean(invalid) || (!total && !noteCount);
  if (invalid) {
    status.textContent = "Enter a whole number of zero or more for each target.";
    return;
  }
  const edits = total ? `${total} count ${total === 1 ? "edit" : "edits"}` : "No count edits";
  const withNotes = noteCount ? ` · Notes on ${noteCount} ${noteCount === 1 ? "chapter" : "chapters"}` : "";
  status.textContent = edits + withNotes + (storageAvailable ? " · Saved in this browser" : " · Download edits to keep them");
}

function countRow(component) {
  const current = chapter.counts[component.id] ?? 0;
  const key = keyFor(chapter.id, component.id);
  const row = document.createElement("tr");
  const labelCell = document.createElement("td");
  const label = document.createElement("label");
  label.className = "component-name";
  label.htmlFor = "target-" + component.id;
  label.textContent = component.emoji + " " + component.name;
  const unit = document.createElement("span");
  unit.className = "unit";
  unit.id = "unit-" + component.id;
  unit.textContent = component.unit;
  labelCell.append(label, unit);

  const currentCell = document.createElement("td");
  currentCell.className = "numeric";
  currentCell.textContent = current;

  const targetCell = document.createElement("td");
  targetCell.className = "numeric";
  const input = document.createElement("input");
  input.id = label.htmlFor;
  input.type = "number";
  input.min = 0;
  input.step = 1;
  input.inputMode = "numeric";
  input.value = changes.get(key) ?? current;
  input.setAttribute("aria-describedby", unit.id);
  input.setAttribute("aria-label", `Target for ${component.name} in ${chapter.name}`);
  row.classList.toggle("changed", changes.has(key));
  input.addEventListener("input", () => {
    const target = input.valueAsNumber;
    const valid = Number.isSafeInteger(target) && target >= 0;
    input.setAttribute("aria-invalid", String(!valid));
    if (valid) {
      if (target === current) changes.delete(key);
      else changes.set(key, target);
      row.classList.toggle("changed", changes.has(key));
      save();
    }
    updateStatus();
  });
  targetCell.append(input);
  row.append(labelCell, currentCell, targetCell);
  return row;
}

function renderCounts() {
  list.replaceChildren();
  let category = "";
  for (const component of baseline.components) {
    const key = keyFor(chapter.id, component.id);
    if (!showAll.checked && !chapter.counts[component.id] && !changes.has(key)) continue;
    if (category !== component.category) {
      category = component.category;
      const group = document.createElement("tr");
      group.className = "group";
      const heading = document.createElement("th");
      heading.colSpan = 3;
      heading.textContent = category;
      group.append(heading);
      list.append(group);
    }
    list.append(countRow(component));
  }
  updateStatus();
}

function renderChapter() {
  document.getElementById("chapter-title").textContent = chapter.name;
  document.getElementById("chapter-art").src = "../game/art/" + chapter.backdrop;
  document.getElementById("chapter-scenes").textContent = chapter.sceneCount + " scenes · " + chapter.scenes.join(" · ");
  document.getElementById("chapter-ambience").textContent = chapter.ambience;
  const plankList = document.getElementById("plank-list");
  plankList.replaceChildren();
  document.getElementById("planks").hidden = !chapter.planks.length;
  for (const {scene, sizes} of chapter.planks) {
    const row = document.createElement("li");
    row.textContent = scene + " — " + sizes.join(" → ");
    plankList.append(row);
  }
  notes.value = chapterNotes.get(chapter.id) ?? "";
  renderCounts();
}

restore();
for (const item of baseline.chapters) {
  const option = document.createElement("option");
  option.value = item.id;
  option.textContent = `${String(item.id).padStart(2, "0")} · ${item.name}`;
  picker.append(option);
}
picker.value = chapter.id;
picker.addEventListener("change", () => {
  chapter = baseline.chapters.find(item => item.id === Number(picker.value));
  save();
  renderChapter();
});
showAll.addEventListener("change", renderCounts);
notes.addEventListener("input", () => {
  if (notes.value.trim()) chapterNotes.set(chapter.id, notes.value);
  else chapterNotes.delete(chapter.id);
  save();
  updateStatus();
});
download.addEventListener("click", () => {
  const chapters = baseline.chapters.flatMap(item => {
    const counts = baseline.components.flatMap(component => {
      const key = keyFor(item.id, component.id);
      if (!changes.has(key)) return [];
      return [{componentId: component.id, component: component.name,
        current: item.counts[component.id] ?? 0, target: changes.get(key)}];
    });
    const note = chapterNotes.get(item.id);
    if (!counts.length && !note) return [];
    return [{chapter: item.id, name: item.name, counts, ...(note ? {notes: note} : {})}];
  });
  const report = {schemaVersion: 1, game: "The Last Ferry", source: "docs/chapter-contents.md",
    baselineSha256: baseline.revision, chapters};
  const href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + "\n"], {type: "application/json"}));
  const link = document.createElement("a");
  link.href = href;
  link.download = "last-ferry-chapter-edits.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
});
renderChapter();
</script>
